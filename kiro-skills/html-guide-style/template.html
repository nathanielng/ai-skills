<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <style>
    :root {
      --bg: #1B1B2F;
      --surface: #22223A;
      --surface2: #2A2A45;
      --accent: #00B4D8;
      --accent2: #48CAE4;
      --text: #E0E0E0;
      --muted: #999999;
      --light: #CCCCCC;
      --border: #3a3a5c;
      --green: #7ee787;
      --yellow: #e3b341;
      --kbd-bg: #2e2e4a;
      --kbd-border: #5a5a8a;
      --code-bg: #16162a;
      --table-header: #00769E;
      --table-even: #2A2A45;
      --table-odd: #22223A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    nav {
      width: 240px;
      min-width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.2rem 1rem 2rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      transition: width 0.22s ease, min-width 0.22s ease, padding 0.22s ease;
    }
    nav.collapsed {
      width: 48px;
      min-width: 48px;
      padding: 1.2rem 0.4rem 2rem;
    }
    nav.collapsed .nav-inner { opacity: 0; pointer-events: none; }
    .nav-inner { transition: opacity 0.15s ease; }

    /* Toggle button */
    .nav-toggle {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }
    .nav-toggle button {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 0.3rem 0.45rem;
      line-height: 1;
      font-size: 0.9rem;
      transition: color 0.15s, background 0.15s;
    }
    .nav-toggle button:hover { color: var(--accent); background: #2e2e4a; }

    /* Collapsed expand button — floats at top of collapsed rail */
    .nav-expand {
      display: none;
      position: absolute;
      top: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 0.3rem 0.45rem;
      font-size: 0.9rem;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
    }
    .nav-expand:hover { color: var(--accent); background: #2e2e4a; }
    nav.collapsed .nav-expand { display: block; }
    nav.collapsed .nav-toggle { display: none; }

    nav .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    nav .logo svg { width: 20px; height: 20px; flex-shrink: 0; }
    nav .subtitle { font-size: 0.75rem; color: var(--muted); margin-bottom: 1.5rem; }
    nav ul { list-style: none; }
    nav ul li { margin: 0.15rem 0; }
    nav ul li a {
      display: block;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      color: var(--light);
      text-decoration: none;
      font-size: 0.85rem;
      transition: background 0.15s, color 0.15s;
      border-left: 3px solid transparent;
    }
    nav ul li a:hover { background: var(--surface2); color: var(--accent2); }
    nav ul li a.active {
      background: #1e3a42;
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 600;
    }
    nav ul li.section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding: 0.8rem 0.6rem 0.3rem;
    }

    /* Main content */
    main {
      flex: 1;
      max-width: 860px;
      padding: 3rem 3rem 5rem;
      overflow-x: hidden;
    }

    /* Header */
    .page-header {
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .page-header h1 {
      font-size: 2rem;
      color: var(--accent);
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    .page-header .meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.2rem 0.7rem;
      font-size: 0.78rem;
      color: var(--light);
    }
    .badge code { background: none; padding: 0; color: var(--accent2); font-size: 0.78rem; }

    /* Sections */
    section { margin-bottom: 3rem; }
    h2 {
      font-size: 1.4rem;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    h2 .icon { font-size: 1.1rem; }
    h3 {
      font-size: 1rem;
      color: var(--accent2);
      font-weight: 600;
      margin: 1.5rem 0 0.6rem;
    }
    p { margin-bottom: 0.8rem; color: var(--light); }

    /* Inline code */
    code {
      background: var(--kbd-bg);
      color: var(--accent2);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", Menlo, monospace;
      font-size: 0.88em;
    }

    /* Code blocks */
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.2rem 1.4rem;
      overflow-x: auto;
      margin: 0.8rem 0 1rem;
      position: relative;
    }
    pre code {
      background: none;
      padding: 0;
      color: var(--text);
      font-size: 0.875rem;
      line-height: 1.6;
    }
    pre .comment { color: #636e85; }
    .lang-label {
      position: absolute;
      top: 0.5rem;
      right: 0.8rem;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-family: "SF Mono", Menlo, monospace;
    }

    /* Kbd */
    kbd {
      display: inline-block;
      background: var(--kbd-bg);
      border: 1px solid var(--kbd-border);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 0.1em 0.45em;
      font-family: "SF Mono", "Fira Code", Menlo, monospace;
      font-size: 0.82em;
      color: var(--text);
      white-space: nowrap;
    }

    /* Tables */
    .table-wrap { overflow-x: auto; margin: 0.8rem 0 1rem; border-radius: 8px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: var(--table-header);
      color: #fff;
      padding: 0.6rem 1rem;
      text-align: left;
      font-size: 0.85rem;
      font-weight: 600;
    }
    tbody tr:nth-child(even) td { background: var(--table-even); }
    tbody tr:nth-child(odd) td { background: var(--table-odd); }
    tbody tr:hover td { background: #323255; }
    td {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      border-top: 1px solid var(--border);
      color: var(--light);
      vertical-align: top;
    }
    td:first-child { white-space: nowrap; }

    /* Callouts */
    .callout {
      background: var(--surface2);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 0.8rem 1.1rem;
      margin: 0.8rem 0 1rem;
      font-size: 0.9rem;
      color: var(--light);
    }
    .callout.tip { border-color: var(--green); }
    .callout.warn { border-color: var(--yellow); }
    .callout strong { color: var(--accent2); }
    .callout.tip strong { color: var(--green); }
    .callout.warn strong { color: var(--yellow); }

    /* Lists */
    ul, ol {
      padding-left: 1.4rem;
      margin-bottom: 0.8rem;
      color: var(--light);
    }
    li { margin: 0.3rem 0; }

    /* Quick ref card */
    .quick-ref {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.8rem;
    }
    .qr-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
    }
    .qr-item .want { color: var(--light); flex: 1; }
    .qr-item .keys { color: var(--accent2); font-family: "SF Mono", Menlo, monospace; font-size: 0.8rem; white-space: nowrap; }

    /* Links section */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.75rem;
      margin-top: 0.8rem;
    }
    .link-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      text-decoration: none;
      color: var(--light);
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.875rem;
    }
    .link-card:hover { border-color: var(--accent); background: #2e2e4a; color: var(--accent2); }
    .link-card .link-icon { font-size: 1.2rem; }

    @media (max-width: 900px) {
      nav { display: none; }
      main { padding: 2rem 1.5rem 4rem; max-width: 100%; }
      .quick-ref { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav id="sidebar">
  <button class="nav-expand" id="navExpand" title="Expand sidebar">&#x276F;</button>
  <div class="nav-inner">
    <div class="nav-toggle">
      <button id="navCollapse" title="Collapse sidebar">&#x276E;</button>
    </div>
    <div class="logo">{{LOGO_LABEL}}</div>
    <div class="subtitle">{{SUBTITLE}}</div>
    <ul id="navLinks">
      <li class="section-label">Contents</li>
      <!-- One <li><a href="#section-id">Section Title</a></li> per top-level section -->
      {{NAV_LINKS}}
    </ul>
  </div>
</nav>

<main>
  <div class="page-header">
    <h1>{{PAGE_H1}}</h1>
    <div class="meta">
      <!-- Zero or more <span class="badge">...</span>, e.g. platform, date, source -->
      {{BADGES}}
    </div>
  </div>

  <!--
    One <section id="..."> per nav link. Components available inside a section:

    <h2><span class="icon">🖥️</span> Section Title</h2>
    <h3>Sub-heading</h3>
    <p>Paragraph text.</p>
    <ul><li>List item</li></ul>

    <div class="callout">Neutral callout (accent border).</div>
    <div class="callout tip"><strong>Tip:</strong> ...</div>
    <div class="callout warn"><strong>Note:</strong> ...</div>

    <pre><code><span class="comment"># comment</span>
    actual code line</code><span class="lang-label">bash</span></pre>

    <kbd>Ctrl</kbd>+<kbd>p</kbd>  -- for keyboard shortcuts

    <div class="table-wrap">
      <table>
        <thead><tr><th>Col</th></tr></thead>
        <tbody><tr><td>Cell</td></tr></tbody>
      </table>
    </div>

    <div class="quick-ref">
      <div class="qr-item"><span class="want">What you want</span><span class="keys">the keys/answer</span></div>
    </div>

    <div class="links-grid">
      <a class="link-card" href="..." target="_blank"><span class="link-icon">📖</span> Label</a>
    </div>
  -->
  {{SECTIONS}}

<script>
  // --- Collapse / expand ---
  const sidebar = document.getElementById('sidebar');
  document.getElementById('navCollapse').addEventListener('click', () => {
    sidebar.classList.add('collapsed');
  });
  document.getElementById('navExpand').addEventListener('click', () => {
    sidebar.classList.remove('collapsed');
  });

  // --- Active section highlighting via IntersectionObserver ---
  const sections = document.querySelectorAll('main section[id]');
  const navLinks = document.querySelectorAll('#navLinks a');

  function setActive(id) {
    navLinks.forEach(a => {
      const isActive = a.getAttribute('href') === '#' + id;
      a.classList.toggle('active', isActive);
      if (isActive) {
        a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    });
  }

  const visible = new Map();

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => visible.set(e.target.id, e.isIntersecting));
    for (const section of sections) {
      if (visible.get(section.id)) {
        setActive(section.id);
        return;
      }
    }
  }, {
    rootMargin: '0px 0px -60% 0px',
    threshold: 0
  });

  sections.forEach(s => observer.observe(s));
</script>
</body>
</html>
